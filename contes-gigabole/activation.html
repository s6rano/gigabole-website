<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#1d211d"><meta name="robots" content="noindex, nofollow"><meta http-equiv="Cache-Control" content="no-store"><title>Activation du compte — Gigabole Kids</title><link rel="stylesheet" href="./styles.css"></head>
<body><main class="site-shell narrow-shell"><header class="site-header"><a class="brand" href="./"><span>Gigabole Kids</span><strong>Activation</strong></a></header><section class="panel activation-panel" aria-labelledby="activation-title"><p class="eyebrow">Votre compte</p><h1 id="activation-title">Choisissez votre mot de passe.</h1><p>Utilisez au moins 12 caractères, avec une minuscule, une majuscule et un chiffre.</p><p id="activation-notice" class="notice" role="alert" aria-live="assertive" hidden></p><form id="activation-form" class="form-panel" hidden><label for="activation-password">Nouveau mot de passe<input id="activation-password" type="password" autocomplete="new-password" minlength="12" required></label><label for="activation-confirmation">Confirmer le mot de passe<input id="activation-confirmation" type="password" autocomplete="new-password" minlength="12" required></label><button class="button" type="submit">Activer mon compte</button></form><div id="activation-success" hidden><a class="button" href="./connexion.html">Ouvrir ma boîte à lecture</a></div><p class="field-help">Lien expiré ou absent ? Revenez à la <a href="./connexion.html">connexion</a> pour demander un nouveau lien si votre compte est déjà actif.</p></section><footer class="site-footer"><button type="button" class="text-button" data-cookie-settings>Gérer mes cookies</button></footer></main><script type="module" src="./js/activation.js"></script><script type="module" src="./js/cookie-consent.js"></script></body></html>
